name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Build distributable app bundle
        run: make dist

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/PomodoroBar.app.zip
            dist/PomodoroBar.dmg
          generate_release_notes: true
